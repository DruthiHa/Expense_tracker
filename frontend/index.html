<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinAudit — Personal Finance & Subscription Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #080a0f;
    --bg1: #0d1018;
    --bg2: #111420;
    --bg3: #161926;
    --bg4: #1c2030;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.1);
    --text: #e8eaf0;
    --text2: #7a80a0;
    --text3: #3d4260;
    --accent: #4f8cff;
    --accent2: #7c5cfc;
    --green: #22d3a0;
    --red: #ff5c6c;
    --amber: #ffb628;
    --purple: #a78bfa;
    --cyan: #22d3ee;
    --pink: #f472b6;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --sidebar-w: 220px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; overflow:hidden; }
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:2px; }
  a { color:inherit; text-decoration:none; }

  /* Novelty: Service Decay Styles */
  .decayed-row { background: rgba(255, 92, 108, 0.04) !important; }
  .decayed-row td { opacity: 0.6; }
  .decay-badge { background: var(--red); color: #fff; font-size: 8px; font-weight: 800; padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
  .project-tag { font-size: 10px; color: var(--accent); background: rgba(79, 140, 255, 0.1); padding: 1px 5px; border-radius: 4px; margin-top: 4px; display: inline-block; }

  /* ── Layout ── */
  .layout { display:flex; height:100vh; }

  /* ── Sidebar ── */
  .sidebar {
    width:var(--sidebar-w); flex-shrink:0;
    background:var(--bg1);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    padding:0;
    position:relative;
    z-index:10;
  }
  .sidebar-logo {
    padding:24px 20px 20px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px;
  }
  .logo-mark {
    width:34px; height:34px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:15px; color:#fff;
    flex-shrink:0;
  }
  .logo-text { font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:-0.3px; }
  .logo-text span { color:var(--accent); }
  .sidebar-nav { flex:1; padding:12px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
  .nav-section-label {
    font-size:9px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--text3); padding:10px 10px 4px;
  }
  .nav-item {
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:10px;
    font-size:12.5px; font-weight:400; color:var(--text2);
    cursor:pointer; transition:all 0.15s;
    position:relative; user-select:none;
  }
  .nav-item:hover { background:var(--bg3); color:var(--text); }
  .nav-item.active { background:rgba(79,140,255,0.12); color:var(--accent); font-weight:500; }
  .nav-item.active::before {
    content:''; position:absolute; left:0; top:20%; bottom:20%;
    width:3px; background:var(--accent); border-radius:0 2px 2px 0;
  }
  .nav-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
  .nav-badge {
    margin-left:auto; background:var(--red); color:#fff;
    font-size:9px; font-weight:700; padding:2px 6px;
    border-radius:20px; min-width:18px; text-align:center;
  }
  .sidebar-footer {
    padding:14px 16px 18px;
    border-top:1px solid var(--border);
  }
  .savings-rate-card {
    background:var(--bg3); border-radius:10px; padding:12px;
  }
  .savings-rate-label { font-size:9px; color:var(--text3); font-weight:600; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:6px; }
  .savings-rate-value { font-family:var(--font-display); font-size:22px; font-weight:700; }
  .savings-rate-bar { height:4px; background:var(--bg4); border-radius:2px; margin-top:8px; overflow:hidden; }
  .savings-rate-fill { height:100%; border-radius:2px; background:linear-gradient(90deg,var(--green),var(--accent)); transition:width 0.6s; }

  /* ── Main ── */
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar {
    padding:16px 28px;
    border-bottom:1px solid var(--border);
    background:var(--bg1);
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0; z-index:5;
  }
  .topbar-left { display:flex; flex-direction:column; gap:2px; }
  .page-title { font-family:var(--font-display); font-size:18px; font-weight:700; letter-spacing:-0.3px; }
  .page-subtitle { font-size:11px; color:var(--text3); }
  .topbar-right { display:flex; align-items:center; gap:10px; }
  .content { flex:1; overflow-y:auto; padding:24px 28px; }

  /* ── Buttons ── */
  .btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 16px; border-radius:var(--radius-sm);
    font-family:var(--font-body); font-size:12px; font-weight:500;
    cursor:pointer; border:none; transition:all 0.15s;
    white-space:nowrap;
  }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#6fa0ff; transform:translateY(-1px); }
  .btn-ghost { background:var(--bg3); color:var(--text2); border:1px solid var(--border2); }
  .btn-ghost:hover { color:var(--text); background:var(--bg4); }
  .btn-danger { background:rgba(255,92,108,0.15); color:var(--red); border:1px solid rgba(255,92,108,0.2); }
  .btn-danger:hover { background:rgba(255,92,108,0.25); }
  .btn-sm { padding:5px 10px; font-size:11px; }
  .btn-icon { width:30px; height:30px; padding:0; justify-content:center; border-radius:8px; }

  /* ── Cards ── */
  .card {
    background:var(--bg2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
  }
  .card-sm { padding:14px 16px; border-radius:var(--radius-sm); }
  .card-title {
    font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text3); margin-bottom:14px;
  }

  /* ── Grid ── */
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .g4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .mb { margin-bottom:16px; }
  .mb-sm { margin-bottom:10px; }

  /* ── Metric Cards ── */
  .metric-card {
    background:var(--bg2); border:1px solid var(--border);
    border-radius:var(--radius); padding:18px;
    position:relative; overflow:hidden;
    transition:border-color 0.2s;
  }
  .metric-card:hover { border-color:var(--border2); }
  .metric-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:var(--accent-color, var(--accent));
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .metric-label { font-size:10px; color:var(--text3); font-weight:600; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px; }
  .metric-value { font-family:var(--font-mono); font-size:22px; font-weight:500; color:var(--text); letter-spacing:-0.5px; line-height:1; }
  .metric-change { font-size:11px; color:var(--text3); margin-top:6px; display:flex; align-items:center; gap:4px; }
  .metric-change.pos { color:var(--green); }
  .metric-change.neg { color:var(--red); }
  .metric-icon { position:absolute; right:16px; top:16px; font-size:22px; opacity:0.15; }

  /* ── Badges ── */
  .badge {
    display:inline-flex; align-items:center; gap:3px;
    padding:3px 9px; border-radius:20px;
    font-size:10px; font-weight:500; letter-spacing:0.02em;
  }
  .badge-green { background:rgba(34,211,160,0.12); color:var(--green); }
  .badge-red { background:rgba(255,92,108,0.12); color:var(--red); }
  .badge-amber { background:rgba(255,182,40,0.12); color:var(--amber); }
  .badge-blue { background:rgba(79,140,255,0.12); color:var(--accent); }
  .badge-purple { background:rgba(167,139,250,0.12); color:var(--purple); }
  .badge-cyan { background:rgba(34,211,238,0.12); color:var(--cyan); }

  /* ── Tables ── */
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  thead th {
    font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text3); padding:8px 12px; text-align:left;
    border-bottom:1px solid var(--border);
  }
  tbody tr { border-bottom:1px solid var(--border); transition:background 0.12s; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:rgba(255,255,255,0.02); }
  tbody td { padding:10px 12px; font-size:12.5px; color:var(--text); }
  .td-mono { font-family:var(--font-mono); font-size:12px; }
  .td-muted { color:var(--text2); font-size:11px; }

  /* ── Forms ── */
  .form-group { margin-bottom:12px; }
  .form-label { font-size:10px; font-weight:600; color:var(--text3); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:5px; display:block; }
  .form-input, .form-select {
    width:100%; background:var(--bg3); border:1px solid var(--border2);
    border-radius:var(--radius-sm); padding:9px 12px;
    font-family:var(--font-body); font-size:12.5px; color:var(--text);
    outline:none; transition:border-color 0.15s;
  }
  .form-input:focus, .form-select:focus { border-color:var(--accent); }
  .form-select { cursor:pointer; }
  .form-input::placeholder { color:var(--text3); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* ── Tab Row ── */
  .tab-row { display:flex; gap:0; background:var(--bg3); border-radius:10px; padding:3px; margin-bottom:16px; }
  .tab { flex:1; padding:7px 12px; font-size:12px; font-weight:500; text-align:center; border-radius:8px; cursor:pointer; color:var(--text3); transition:all 0.15s; }
  .tab.active { background:var(--bg4); color:var(--text); box-shadow:0 1px 6px rgba(0,0,0,0.3); }

  /* ── Progress Bar ── */
  .progress-wrap { margin-bottom:10px; }
  .progress-lbl { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text2); margin-bottom:5px; }
  .progress-track { height:5px; background:var(--bg4); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:3px; transition:width 0.5s ease; }

  /* ── Alert items ── */
  .alert-item {
    display:flex; gap:12px; padding:12px 0;
    border-bottom:1px solid var(--border); align-items:flex-start;
  }
  .alert-item:last-child { border-bottom:none; }
  .alert-dot { width:8px; height:8px; border-radius:50%; margin-top:4px; flex-shrink:0; }
  .alert-txt { font-size:12px; color:var(--text); line-height:1.5; font-weight:400; }
  .alert-sub { font-size:10px; color:var(--text3); margin-top:3px; }
  .alert-action { margin-left:auto; flex-shrink:0; }

  /* ── Subscription rows ── */
  .sub-row {
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--border);
    transition:background 0.12s;
  }
  .sub-row:last-child { border-bottom:none; }
  .sub-icon {
    width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
    background:var(--bg4);
  }
  .sub-name { font-size:13px; font-weight:500; color:var(--text); }
  .sub-meta { font-size:10px; color:var(--text3); margin-top:2px; }
  .sub-amt { font-family:var(--font-mono); font-size:13px; color:var(--text); font-weight:500; text-align:right; }
  .sub-yr { font-size:10px; color:var(--text3); margin-top:2px; text-align:right; }

  /* ── Modal overlay ── */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.7);
    backdrop-filter:blur(4px); z-index:100;
    display:flex; align-items:center; justify-content:center;
    animation:fadeIn 0.15s;
  }
  .modal {
    background:var(--bg2); border:1px solid var(--border2);
    border-radius:18px; padding:28px;
    width:520px; max-width:90vw; max-height:90vh; overflow-y:auto;
    animation:slideUp 0.2s;
    box-shadow:0 24px 80px rgba(0,0,0,0.6);
  }
  .modal-title { font-family:var(--font-display); font-size:17px; font-weight:700; margin-bottom:20px; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes slideUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }

  /* ── Divider ── */
  .divider { height:1px; background:var(--border); margin:16px 0; }

  /* ── Empty state ── */
  .empty { text-align:center; padding:48px 20px; color:var(--text3); font-size:13px; }
  .empty-icon { font-size:36px; margin-bottom:12px; opacity:0.4; }
  .empty-title { font-size:14px; color:var(--text2); margin-bottom:6px; font-weight:500; }

  /* ── Toast ── */
  #toast {
    position:fixed; bottom:28px; right:28px;
    background:var(--bg3); border:1px solid var(--border2);
    border-radius:12px; padding:12px 18px;
    font-size:12.5px; color:var(--text);
    box-shadow:var(--shadow); z-index:999;
    transform:translateY(80px); opacity:0;
    transition:all 0.25s;
    display:flex; align-items:center; gap:10px;
    pointer-events:none;
  }
  #toast.show { transform:translateY(0); opacity:1; }
  #toast .toast-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* ── Chart containers ── */
  .chart-box { position:relative; }

  /* ── Spend category list ── */
  .cat-item { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .cat-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .cat-name { font-size:11.5px; color:var(--text2); flex:1; }
  .cat-amt { font-family:var(--font-mono); font-size:11px; color:var(--text); }
  .cat-pct { font-size:10px; color:var(--text3); width:32px; text-align:right; }

  /* ── Goal card ── */
  .goal-card {
    background:var(--bg3); border:1px solid var(--border);
    border-radius:12px; padding:14px 16px; margin-bottom:10px;
  }
  .goal-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .goal-name { font-size:13px; font-weight:500; color:var(--text); }
  .goal-amounts { font-family:var(--font-mono); font-size:11px; color:var(--text3); margin-top:2px; }

  /* ── Notification banner ── */
  .banner {
    border-radius:10px; padding:12px 16px;
    display:flex; gap:12px; align-items:flex-start; margin-bottom:16px;
    border:1px solid;
  }
  .banner-red { background:rgba(255,92,108,0.08); border-color:rgba(255,92,108,0.2); }
  .banner-amber { background:rgba(255,182,40,0.08); border-color:rgba(255,182,40,0.2); }
  .banner-green { background:rgba(34,211,160,0.08); border-color:rgba(34,211,160,0.2); }
  .banner-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
  .banner-txt { font-size:12px; color:var(--text2); line-height:1.5; }
  .banner-txt strong { color:var(--text); font-weight:500; }

  /* ── Animations ── */
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; margin-right:4px; }

  /* ── Scrollable list ── */
  .scroll-list { max-height:320px; overflow-y:auto; }

  /* ── Trend sparkline ── */
  canvas { display:block; }

  /* ── Responsive tweaks ── */
  @media (max-width: 900px) {
    :root { --sidebar-w: 56px; }
    .logo-text, .nav-item span:not(.nav-icon), .nav-section-label, .sidebar-footer { display:none; }
    .nav-item { justify-content:center; padding:10px; }
    .sidebar-logo { justify-content:center; padding:16px 10px; }
    .g4 { grid-template-columns:1fr 1fr; }
    .g3 { grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>

<div id="toast"><span class="toast-dot" id="toast-dot"></span><span id="toast-msg"></span></div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">₹</div>
      <div class="logo-text">Fin<span>Audit</span></div>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div class="savings-rate-card">
        <div class="savings-rate-label">Savings rate</div>
        <div class="savings-rate-value" id="savings-rate-val">—</div>
        <div class="savings-rate-bar"><div class="savings-rate-fill" id="savings-rate-bar" style="width:0%"></div></div>
      </div>

  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="page-subtitle" id="page-subtitle"><span class="live-dot"></span>Live view · April 2026</div>
      </div>
      <div class="topbar-right" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

const fmt = n => '₹' + Math.abs(Number(n)).toLocaleString('en-IN');
const fmtAmt = (n, type) => (type === 'income' ? '+' : '-') + fmt(n);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const daysUntil = d => Math.ceil((new Date(d) - new Date()) / 86400000);
const daysSince = d => Math.floor((new Date() - new Date(d)) / 86400000);
const clamp = (v,min,max) => Math.min(Math.max(v,min),max);
let toastTimer;
function toast(msg, type='green') {
  const el = document.getElementById('toast');
  const dot = document.getElementById('toast-dot');
  const msgEl = document.getElementById('toast-msg');
  dot.style.background = type === 'green' ? 'var(--green)' : type === 'red' ? 'var(--red)' : 'var(--amber)';
  msgEl.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
function nextId(arr) { return arr.length ? Math.max(...arr.map(x=>x.id)) + 1 : 1; }

// COMPUTED STATS
// ══════════════════════════════════════════════
function getStats() {
  const income = DB.transactions.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
  const expenses = DB.transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
  const subTotal = DB.subscriptions.reduce((a,b)=>a+b.amount,0);
  const savings = income - expenses;
  const savingsRate = income ? pct(savings,income) : 0;

  const catSpend = {};
  DB.transactions.filter(t=>t.type==='expense').forEach(t=>{
    catSpend[t.category] = (catSpend[t.category]||0) + t.amount;
  });
  // Add subscriptions as a category spend
  catSpend['Subscriptions'] = (catSpend['Subscriptions']||0) + subTotal;

  return {income, expenses, subTotal, savings, savingsRate, catSpend};
}

function getAlerts() {
  const alerts = [];
  const {catSpend, savings, income} = getStats();

  // Novelty Alert: Project Decay
  DB.subscriptions.forEach(s => {
    if (s.projectEnd && new Date(s.projectEnd) < new Date()) {
        alerts.push({
            type: 'red',
            icon: '🏗️',
            msg: `Project for ${s.name} has concluded.`,
            sub: `End date was ${s.projectEnd}. You may be paying for an idle resource.`,
            action: 'subscriptions'
        });
    }
  });

  // Unused subscriptions
  DB.subscriptions.filter(s=>s.status==='unused').forEach(s => {
    const days = daysSince(s.lastUsed);
    alerts.push({
      type:'red', icon:'⚠',
      msg:`${s.name} unused for ${days} days — ${fmt(s.amount)}/mo wasted`,
      sub:`Cancel to save ${fmt(s.amount*12)}/yr`,
      action:'subscriptions'
    });
  });

  // Upcoming renewals
  DB.subscriptions.forEach(s => {
    const d = daysUntil(s.renewDate);
    if (d >= 0 && d <= 5) {
      alerts.push({
        type:'amber', icon:'🔔',
        msg:`${s.name} renews in ${d === 0 ? 'today' : d + ' days'} — ${fmt(s.amount)}`,
        sub:`Due: ${new Date(s.renewDate).toDateString()}`,
        action:'subscriptions'
      });
    }
  });

  // Budget overruns
  DB.budgets.forEach(b => {
    const spent = catSpend[b.cat] || 0;
    const p = pct(spent, b.limit);
    if (p >= 100) {
      alerts.push({type:'red', icon:'🚫', msg:`${b.cat} budget exceeded! ${fmt(spent)} of ${fmt(b.limit)}`, sub:'Reduce spending in this category', action:'budgets'});
    } else if (p >= 80) {
      alerts.push({type:'amber', icon:'📊', msg:`${b.cat} at ${p}% of budget`, sub:`${fmt(spent)} of ${fmt(b.limit)} used`, action:'budgets'});
    }
  });

  // Savings milestone
  if (savings > 0) {
    alerts.push({type:'green', icon:'🎉', msg:`You saved ${fmt(savings)} this month`, sub:savings > 20000 ? 'Excellent — above target!' : 'Keep it up!'});
  } else if (savings < 0) {
    alerts.push({type:'red', icon:'📉', msg:`Deficit of ${fmt(Math.abs(savings))} this month`, sub:'Expenses exceed income'});
  }

  // Review subs
  DB.subscriptions.filter(s=>s.status==='review').forEach(s => {
    alerts.push({type:'amber', icon:'🔍', msg:`${s.name} marked for review — ${fmt(s.amount)}/mo`, sub:'Decide: keep, downgrade or cancel'});
  });

  return alerts;
}

function renderPage() {
  const titles = {

  const [title, subtitle] = titles[currentPage];

  document.getElementById('page-subtitle').innerHTML = `<span class="live-dot"></span>${subtitle}`;

  const actions = {

  const content = document.getElementById('content');

}

  DB.subscriptions = DB.subscriptions.filter(s=>s.id!==id);

  renderPage(); renderNav();

function renderBudgets() {

        {lbl:'Total spent',val:fmt(Object.values(catSpend).reduce((a,b)=>a+b,0)),color:'var(--amber)'},
        {lbl:'Over-budget cats',val:DB.budgets.filter(b=>(catSpend[b.cat]||0)>b.limit).length,color:'var(--red)'},
        {lbl:'Goal completion',val:DB.goals.length?Math.round(DB.goals.reduce((a,g)=>a+pct(g.saved,g.target),0)/DB.goals.length)+'%':'—',color:'var(--green)'},
      ].map(m=>`
        <div style="background:var(--bg3);border-radius:10px;padding:14px">

        </div>

}

function renderAlerts() {
  const alerts = getAlerts();

    amber: {label:'Warnings', badge:'badge-amber', dotColor:'var(--amber)'},
    green: {label:'Good News', badge:'badge-green', dotColor:'var(--green)'},
  };

  const html = Object.entries(groups).filter(([,arr])=>arr.length>0).map(([type,arr])=>`
    <div class="card mb">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="card-title" style="margin:0">${groupMeta[type].label}</div>

          <div style="flex:1">
            <div class="alert-txt">${a.icon} ${a.msg}</div>
            <div class="alert-sub">${a.sub}</div>
          </div>
          ${a.action ? `<button class="btn btn-ghost btn-sm" onclick="navigate('${a.action}')">View →</button>` : ''}
        </div>
      `).join('')}
    </div>
  `).join('');

  return `
  <div class="g4 mb">
    ${[
      {lbl:'Critical alerts',val:groups.red.length,color:'var(--red)'},
      {lbl:'Warnings',val:groups.amber.length,color:'var(--amber)'},
      {lbl:'Positive signals',val:groups.green.length,color:'var(--green)'},
      {lbl:'Total insights',val:alerts.length,color:'var(--accent)'},
    ].map(m=>`
      <div class="card card-sm" style="border-left:3px solid ${m.color}">
        <div class="metric-label">${m.lbl}</div>
        <div class="metric-value" style="font-size:26px;color:${m.color}">${m.val}</div>
      </div>
    `).join('')}
  </div>
  ${html}
  ${alerts.length===0?'<div class="card"><div class="empty"><div class="empty-icon" style="font-size:48px;opacity:0.5">✅</div><div class="empty-title">All clear! No alerts.</div><div>Your finances look healthy.</div></div></div>':''}`;
}

function openTxModal(type='expense') {
  const cats = ['Food & Dining','Housing','Transport','Shopping','Entertainment','Health','Education','Utilities','Other'];
  const pays = ['UPI','Credit Card','Debit Card','NEFT','Net Banking','Cash'];
  const el = document.createElement('div');
  el.className = 'modal-overlay';
  el.id = 'modal-tx';
  el.innerHTML = `
    <div class="modal">
      <div class="modal-title">Add Transaction</div>
      <div class="tab-row" id="tx-tab-row">
        <div class="tab ${type==='expense'?'active':''}" onclick="setModalTab('expense')">Expense</div>
        <div class="tab ${type==='income'?'active':''}" onclick="setModalTab('income')">Income</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Description *</label>
          <input class="form-input" id="tx-desc" placeholder="What was this for?" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">Amount (₹) *</label>
          <input type="number" class="form-input" id="tx-amount" placeholder="0" min="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="tx-cat">
            <option value="Income">Income</option>
            ${cats.map(c=>`<option value="${c}" ${type==='expense'&&c==='Food & Dining'?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" class="form-input" id="tx-date" value="${new Date().toISOString().slice(0,10)}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Payment Method</label>
          <select class="form-select" id="tx-pay">
            ${pays.map(p=>`<option>${p}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <input class="form-input" id="tx-notes" placeholder="Optional">
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveTx()">Save Transaction</button>
      </div>
    </div>`;
  el.addEventListener('click', e => { if(e.target===el) closeModal(); });
  document.body.appendChild(el);
  window._txType = type;
  setTimeout(()=>document.getElementById('tx-desc')?.focus(), 100);
}

function setModalTab(type) {
  window._txType = type;
  document.querySelectorAll('#tx-tab-row .tab').forEach((t,i)=>t.classList.toggle('active', (i===0&&type==='expense')||(i===1&&type==='income')));
  const catEl = document.getElementById('tx-cat');
  if (catEl) {
    if (type === 'income') catEl.value = 'Income';
    else if (catEl.value === 'Income') catEl.value = 'Food & Dining';
  }
}

function saveTx() {
  const desc = document.getElementById('tx-desc').value.trim();
  const amount = parseFloat(document.getElementById('tx-amount').value);
  if (!desc || !amount || amount <= 0) { toast('Please fill in description and amount', 'amber'); return; }
  DB.transactions.push({
    id: nextId(DB.transactions),
    type: window._txType || 'expense',
    desc, amount,
    category: document.getElementById('tx-cat').value,
    date: document.getElementById('tx-date').value,
    pay: document.getElementById('tx-pay').value,
    notes: document.getElementById('tx-notes').value.trim(),
  });
  saveData(DB);
  closeModal();
  toast(`Transaction saved — ${fmt(amount)}`);
  renderPage(); renderNav();
}

        <div class="form-group">
          <label class="form-label">Already Saved (₹)</label>
          <input type="number" class="form-input" id="goal-saved" placeholder="0" min="0" value="0">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Target Deadline</label>
        <input type="date" class="form-input" id="goal-deadline">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveGoal()">Save Goal</button>
      </div>
    </div>`;
  el.addEventListener('click', e => { if(e.target===el) closeModal(); });
  document.body.appendChild(el);
  setTimeout(()=>document.getElementById('goal-name')?.focus(), 100);
}

function saveGoal() {
  const name = document.getElementById('goal-name').value.trim();
  const target = parseFloat(document.getElementById('goal-target').value);
  if (!name || !target || target <= 0) { toast('Please fill in name and target amount', 'amber'); return; }
  DB.goals.push({
    id: nextId(DB.goals),
    name, target,
    emoji: document.getElementById('goal-emoji').value,
    saved: parseFloat(document.getElementById('goal-saved').value) || 0,
    deadline: document.getElementById('goal-deadline').value || null,
  });
  saveData(DB);
  closeModal();
  toast(`Goal "${name}" created!`);
  renderPage();
}

function openContributeModal(id) {
  const goal = DB.goals.find(g=>g.id===id);
  if (!goal) return;
  const el = document.createElement('div');
  el.className = 'modal-overlay';
  el.innerHTML = `
    <div class="modal" style="width:360px">
      <div class="modal-title">${goal.emoji} ${goal.name}</div>
      <div style="background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2)">
          <span>Saved so far</span><span style="font-family:var(--font-mono)">${fmt(goal.saved)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-top:4px">
          <span>Remaining</span><span style="font-family:var(--font-mono)">${fmt(goal.target - goal.saved)}</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Contribution Amount (₹)</label>
        <input type="number" class="form-input" id="contrib-amt" placeholder="5000" min="0" autofocus>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveContrib(${id})">Add Contribution</button>
      </div>
    </div>`;
  el.addEventListener('click', e => { if(e.target===el) closeModal(); });
  document.body.appendChild(el);
  setTimeout(()=>document.getElementById('contrib-amt')?.focus(), 100);
}

function saveContrib(id) {
  const amt = parseFloat(document.getElementById('contrib-amt').value);
  if (!amt || amt <= 0) { toast('Please enter a valid amount', 'amber'); return; }
  DB.goals = DB.goals.map(g => g.id===id ? {...g, saved: Math.min(g.saved+amt, g.target)} : g);
  saveData(DB);
  closeModal();
  toast(`${fmt(amt)} added to goal!`);
  renderPage();
}

function closeModal() {
  document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
}

// Keyboard shortcut to close modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey||e.ctrlKey) && e.key==='k') {
    e.preventDefault();
    if (currentPage === 'transactions') openTxModal();
    else if (currentPage === 'subscriptions') openSubModal();
    else if (currentPage === 'budgets') openGoalModal();
  }
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
renderNav();
renderPage();
</script>
</body>
</html>
